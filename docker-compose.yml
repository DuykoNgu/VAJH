services:
  # ============================================================================
  # 1. Redis: cache, session state, background-job queue (arq)
  # ============================================================================
  redis:
    image: redis:7
    container_name: lusia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - lusia-network

  # ============================================================================
  # 2. PostgreSQL + pgvector: hồ sơ học sinh, giáo viên, tiến độ học + embedding SGK cho RAG
  #    Schema do `python -m app.migrate` tạo (service `migrate` bên dưới), không tự chạy SQL nữa.
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lusia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lusia
      POSTGRES_PASSWORD: lusia
      POSTGRES_DB: lusia_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lusia -d lusia_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    networks:
      - lusia-network

  # ============================================================================
  # 3. Object storage (S3-compatible) - TẠM PENDING: image MinIO công khai không còn tải được;
  #    chọn server S3 thay thế sau. Code dùng S3 API nên không đổi.
  # ============================================================================
  # minio:
  #   image: quay.io/minio/minio:RELEASE.2024-03-30T09-41-56Z
  #   container_name: lusia-minio
  #   restart: unless-stopped
  #   command: server /data --console-address ":9001"
  #   environment:
  #     MINIO_ROOT_USER: lusia
  #     MINIO_ROOT_PASSWORD: lusia_minio_password
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   volumes:
  #     - minio_data:/data
  #   networks:
  #     - lusia-network

  # ============================================================================
  # Ứng dụng (profile "app"): docker compose --profile app up
  # Không bật profile thì chỉ chạy hạ tầng ở trên, API chạy từ venv local.
  # ============================================================================
  migrate:
    profiles: ["app"]
    build: ./backend
    command: python -m app.migrate
    environment: &app-env
      APP_ENV: development
      AUTH_MODE: dev
      DATABASE_URL: postgresql://lusia:lusia@postgres:5432/lusia_db
      DATABASE_URL_UNPOOLED: postgresql://lusia:lusia@postgres:5432/lusia_db
      REDIS_URL: redis://redis:6379
      FILES_DIR: /data/files   # PDF + ảnh hình; api và worker phải thấy cùng một thư mục
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - lusia-network

  api:
    profiles: ["app"]
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment: *app-env
    env_file:
      - path: ./backend/.env
        required: false
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - hf_cache:/root/.cache/huggingface  # model embedding, tải 1 lần dùng chung api/worker
      - files_data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - lusia-network

  worker:
    profiles: ["app"]
    build: ./backend
    command: arq app.worker.WorkerSettings
    environment: *app-env
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - ./backend/app:/app/app
      - hf_cache:/root/.cache/huggingface
      - files_data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_started
    networks:
      - lusia-network

# ==============================================================================
# Persistent Volumes (Đảm bảo dữ liệu không bị mất khi restart container)
# ==============================================================================
volumes:
  redis_data:
    name: lusia_redis_data
  postgres_data:
    name: lusia_postgres_data
  hf_cache:
    name: lusia_hf_cache
  files_data:
    name: lusia_files_data
  # minio_data:
  #   name: lusia_minio_data

# ==============================================================================
# Networks
# ==============================================================================
networks:
  lusia-network:
    name: lusia-network
    driver: bridge
